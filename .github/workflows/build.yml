name: Build AutoTPA JAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Enable Gradle Wrapper
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoTPA-JAR
          path: |
            build/libs/autotpa-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
